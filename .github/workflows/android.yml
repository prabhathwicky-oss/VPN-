name: Android app

# Builds a signed release APK (sideload/testing) and AAB (Google Play) on every
# push to main that touches the app, or on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE || 'com.ypnvpn.app' }}
      APP_NAME: ${{ vars.APP_NAME || 'YPN VPN' }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project for this Flutter version
        run: |
          flutter create --platforms=android --org com.ypnvpn --project-name ypn_vpn .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with your upload keystore."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — build is signed with a debug key (fine for testing, not for Play)."
          fi

      - name: Build APK + AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          D_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          D_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          D_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          D_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          D_PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          D_TERMS_URL: ${{ vars.TERMS_URL }}
          D_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          # Only pass non-empty values so the app's built-in defaults (e.g. AdMob test ids) still apply.
          DEFINES=(--dart-define=APP_VERSION=$VERSION --dart-define=ANDROID_PACKAGE=$ANDROID_PACKAGE "--dart-define=APP_NAME=$APP_NAME")
          for k in SUPABASE_URL SUPABASE_ANON_KEY ADMOB_BANNER_ID ADMOB_INTERSTITIAL_ID PRIVACY_URL TERMS_URL SUPPORT_EMAIL; do
            v="D_$k"; if [ -n "${!v}" ]; then DEFINES+=("--dart-define=$k=${!v}"); fi
          done
          if [ -z "$D_SUPABASE_URL" ]; then echo "::warning::SUPABASE_URL secret missing — app will show a setup message."; fi
          flutter build apk --release --build-name="$VERSION" --build-number=${{ github.run_number }} "${DEFINES[@]}"
          flutter build appbundle --release --build-name="$VERSION" --build-number=${{ github.run_number }} "${DEFINES[@]}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/ypn-vpn-$VERSION.apk"
          cp build/app/outputs/bundle/release/app-release.aab "../dist/ypn-vpn-$VERSION.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: ypn-vpn-android-${{ github.run_number }}
          path: dist/*
          retention-days: 30

      - name: Publish APK as a GitHub release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: YPN VPN Android 1.0.${{ github.run_number }}
          files: dist/*.apk
          prerelease: true
