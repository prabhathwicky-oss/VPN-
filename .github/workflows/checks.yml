name: Checks

on:
  pull_request:
  push:
    branches: [main]
    paths: ["admin/**", "server/**", "supabase/functions/**", ".github/workflows/checks.yml"]

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: for f in supabase/functions/*/index.ts; do deno check "$f"; done

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n server/install.sh && python3 -m py_compile server/agent.py
      - run: sudo apt-get install -y shellcheck && shellcheck -S error server/install.sh
